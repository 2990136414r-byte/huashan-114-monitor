name: huashan-114-monitor

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '50-59 9 * * *'
    - cron: '0-15 10 * * *'
  workflow_dispatch:
    inputs:
      once:
        description: '只运行一次'
        required: false
        default: 'true'
      dry_run:
        description: 'true=不发送通知'
        required: false
        default: 'false'
      test_push:
        description: 'true=只发送一条测试通知'
        required: false
        default: 'false'

concurrency:
  group: huashan-114-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: huashan-114-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            huashan-114-state-

      - name: Run monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ github.event.inputs.test_push }}" = "true" ]; then
            python monitor.py --test-push
            exit $?
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.once }}" = "true" ]; then
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              python monitor.py --once --dry-run
            else
              python monitor.py --once
            fi
            exit $?
          fi
          python monitor.py --once

      - name: Show state
        if: always()
        run: cat state.json 2>/dev/null || true

